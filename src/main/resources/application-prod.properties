spring.config.activate.on-profile=prod

app.web.base-url=${APP_WEB_BASE_URL}
app.web.oauth-success-path=${APP_WEB_OAUTH_SUCCESS_PATH:/oauth/success}
app.web.oauth-failure-path=${APP_WEB_OAUTH_FAILURE_PATH:/oauth/failure}

app.web.allowed-origin-patterns[0]=${APP_WEB_ALLOWED_ORIGIN_0}
app.web.allowed-origin-patterns[1]=${APP_WEB_ALLOWED_ORIGIN_1}

# =========================
# JPA
# =========================
# Set as update for initial release
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.springframework=INFO
logging.level.com.resumerefiner=INFO
logging.level.org.hibernate.SQL=INFO

# =========================
# Local static file storage (ephemeral, demo only)
# =========================
# Base: Render runtime working directory
app.storage.local.root-dir=${APP_STORAGE_LOCAL_ROOT_DIR:./.local-storage}
app.storage.local.public-base-url=${APP_STORAGE_LOCAL_PUBLIC_BASE_URL:https://<YOUR-RENDER-BACKEND-URL>}

# =========================
# Session Cookie (Vercel <--> Render cross-site)
# =========================
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none

server.port=${PORT:8080}
