# ======================================
# Common: Basic Application information
# ======================================

spring.application.name=ResumeRefiner-backend

# Current profile (default: local)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Application Version (0.0.1)
app.version=${APP_VERSION:0.0.1}

# =========================
# Common: DB Settings (.env based)
# =========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resume_refiner}
spring.datasource.username=${DB_USER:resume}
spring.datasource.password=${DB_PASSWORD:refiner}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ddl-auto, show-sql are divided by profile and set below

# =========================
# Common: Redis Setting
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# =========================
# Common: Spring Session (Redis)
# =========================
spring.session.store-type=redis
spring.session.data.redis.namespace=resume-refiner:session
spring.session.timeout=30m

# =========================
# Actuator (HealthCheck)
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# Logging Default (Overridable By Profile)
# =========================
logging.level.org.springframework=INFO
logging.level.com.resumerefiner=INFO

# Max Upload Size (multipart)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# (Optional) Error Response/Logging
spring.web.error.include-message=always