spring.application.name=ResumeRefiner-backend

# Current profile (default: local)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Application Version
app.version=${APP_VERSION:1.0.0}

# =========================
# DB Settings
# =========================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:resume_refiner}
spring.datasource.username=${DB_USER:resume}
spring.datasource.password=${DB_PASSWORD:refiner}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# =========================
# Redis
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# =========================
# Spring Session (Redis)
# =========================
spring.session.store-type=redis
spring.session.data.redis.namespace=resume-refiner:session
spring.session.timeout=30m

# =========================
# Actuator
# =========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# =========================
# Logging Default (override by profile)
# =========================
logging.level.org.springframework=INFO
logging.level.com.resumerefiner=INFO

# =========================
# Upload size
# =========================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

spring.web.error.include-message=always

# =========================
# AI (OpenAI)
# =========================
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${OPENAI_MODEL:gpt-4.1-mini}
spring.ai.openai.chat.options.temperature=${OPENAI_TEMPERATURE:0.2}

# =========================
# OAuth2 - Google
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
